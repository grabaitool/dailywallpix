<script>
const box = document.getElementById('q'), grid = document.getElementById('results'),
      note = document.getElementById('note'), empty = document.getElementById('empty');
let DATA = [], activeFilter = 'all';
fetch('search-index.json').then(r => r.json()).then(d => { DATA = d; render(); });
function matches(item, q) {
  const hay = (item.title + ' ' + item.pack + ' ' + item.tags.join(' ')).toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function render() {
  const q = (box.value || '').trim().toLowerCase();
  const items = DATA.filter(it => (activeFilter === 'all' || it.pack === activeFilter || it.tags.includes(activeFilter)) && matches(it, q));
  grid.innerHTML = items.map(it =>
    '<a class="wall" href="' + it.url + '"><img src="' + it.img + '" alt="' + it.title + '" loading="lazy"><span class="dl">Download</span></a>').join('');
  note.textContent = items.length + ' result' + (items.length === 1 ? '' : 's') + (q ? ' for “' + q + '”' : '');
  empty.style.display = items.length ? 'none' : 'block';
}
box.addEventListener('input', render);
document.querySelectorAll('.fchip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.fchip').forEach(x => x.classList.remove('on'));
  c.classList.add('on'); activeFilter = c.dataset.f; render();
}));
const start = new URLSearchParams(location.search).get('q');
if (start) box.value = start;
</script>
